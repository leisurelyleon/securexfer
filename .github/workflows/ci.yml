name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev clang-format

      - name: Check formatting
        run: |
          find include src app tests -type f \( -name '*.c' -o -name '*.h' \) \
            | xargs clang-format --dry-run --Werror

      - name: Build (release)
        run: make

      - name: Run tests (AddressSanitizer + UBSan)
        run: make test
